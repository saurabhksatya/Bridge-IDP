services:
  bridge-db:
    image: postgres:18
    container_name: bridge-db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - bridge_postgres_data:/var/lib/postgresql

volumes:
  bridge_postgres_data: